[project]
name = "mcpl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "quant-research-lab",
    "scikit-learn>=1.9.1",
]

[tool.uv.sources]
quant-research-lab = { git = "https://github.com/20070316lbw-netizen/Quant-Research-Lab.git", rev = "db6551a7ecb71d6707057ab26f22db495ee66c4a" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
