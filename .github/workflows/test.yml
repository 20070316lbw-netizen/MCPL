name: Test MCPL
on: [pull_request]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: .venv/bin/python -c 'import torch' && .venv/bin/python -m pytest -q
